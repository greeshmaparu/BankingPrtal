<div class="container mt-4">

    <div class="card shadow">

        <div class="card-body">

            <h2>Add Customer</h2>

            <form [formGroup]="customerForm" (ngSubmit)="saveCustomer()">

                <div class="mb-3">

                    <label>Name</label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="name">

                </div>


                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        class="form-control"
                        formControlName="email">

                </div>


                <div class="mb-3">

                    <label>Phone</label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="phone">

                </div>


                <div class="mb-3">

                    <label>Risk Profile</label>

                    <select
                        class="form-control"
                        formControlName="risk">

                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>

                    </select>

                </div>


                <button
                    class="btn btn-success me-2"
                    type="submit">

                    Save

                </button>


                <button
                    class="btn btn-secondary"
                    type="button"
                    (click)="cancel()">

                    Cancel

                </button>

            </form>

        </div>

    </div>

</div>
